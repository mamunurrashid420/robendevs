apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: dev
  labels:
    app: node-react-app
  annotations:
    # Nginx Ingress Controller annotations
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Enable CORS for API requests
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    # Proxy settings
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
  # Main hostname for the application
  - host: node-react.local
    http:
      paths:
      # API routes - route to backend service
      # Matches /api, /api/, /api/anything
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: backend-service
            port:
              number: 8010
      # Health check endpoint for backend
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8010
      # Frontend routes - catch all remaining requests
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
---
# Alternative Ingress without rewrite (simpler configuration)
# Use this if you don't need path rewriting
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress-simple
  namespace: dev
  labels:
    app: node-react-app
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
  - host: node-react.local
    http:
      paths:
      # API routes first (more specific)
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8010
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8010
      # Frontend catch-all (less specific)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80

