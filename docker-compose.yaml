version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: react-auth-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-react_auth_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: react-auth-backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT_DEV: ${PORT_DEV:-8010}
      # Database - Primary (Write)
      DB_HOST: postgres
      DB_WRITE_URL: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      DB_NAME: ${DB_NAME:-react_auth_db}
      DB_PORT: 5432
      # Database - Replica (Read)
      DB_READ_URL: postgres-replica
      # API Config
      API_VERSION: ${API_VERSION:-v1}
      JWT_VERIFY_SECRET: ${JWT_VERIFY_SECRET:-your-verify-secret}
      JWT_SESSION_SECRET: ${JWT_SESSION_SECRET:-your-session-secret}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-sessionId}
      SESSION_ENCRYPT_SECRET: ${SESSION_ENCRYPT_SECRET:-7EwNLyb6QQX7Mr0B7EwNLyb6QQX7Mr0B}
      SESSION_ALGORITHM: ${SESSION_ALGORITHM:-aes-192-cbc}
      PASSWORD_HASH_CYCLE: ${PASSWORD_HASH_CYCLE:-10}
      IMAGES_DIR: ${IMAGES_DIR:-images}
      API_URL_DEV: http://localhost:8010
      CLIENT_URL_DEV: http://localhost:3000
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-rabbitmq123}
      # Elasticsearch
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
    ports:
      - "8010:8010"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apiserver:/app/apiserver
      - /app/apiserver/node_modules
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: react-auth-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  # ============================================
  # Platform Services
  # ============================================

  redis:
    image: redis:7-alpine
    container_name: react-auth-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: react-auth-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-rabbitmq123}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: react-auth-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  # Postgres Read Replica (simulated)
  postgres-replica:
    image: postgres:14-alpine
    container_name: react-auth-postgres-replica
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-react_auth_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_replica_data:
  redis_data:
  rabbitmq_data:
  elasticsearch_data:

networks:
  app-network:
